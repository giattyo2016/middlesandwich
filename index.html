<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>學餐等待時間模擬器</title>
    <style>
        body { font-family: sans-serif; background: #f0f0f0; margin: 0; display: flex; justify-content: center; }
        .app { width: 100%; max-width: 400px; background: #fff; min-height: 100vh; position: relative; }
        .screen { display: none; padding: 20px; box-sizing: border-box; }
        .screen.active { display: block; }
        .title { text-align: center; font-size: 24px; margin-bottom: 20px; border-bottom: 2px solid #ccc; padding-bottom: 10px; }
        
        /* 畫面1: 找餐 */
        .category-container { display: flex; justify-content: space-between; margin-bottom: 30px; }
        .category-box { width: 30%; height: 60px; border: 1px solid #999; border-radius: 8px; display: flex; justify-content: center; align-items: center; }
        .restaurant-card { border: 1px solid #999; border-radius: 10px; padding: 20px; margin-bottom: 15px; display: flex; justify-content: space-between; cursor: pointer; }
        
        /* 畫面2: 目前 12:00 */
        .back-btn { font-size: 20px; cursor: pointer; margin-bottom: 20px; display: inline-block; }
        .center-content { text-align: center; margin-top: 50px; }
        .big-time { font-size: 32px; font-weight: bold; margin-top: 20px; }
        .bottom-btn { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); font-size: 24px; border-bottom: 2px solid #333; cursor: pointer; }
        
        /* 畫面3: 預訂 */
        .menu-item { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid #eee; }
        .checkbox { width: 24px; height: 24px; border: 2px solid #666; border-radius: 4px; display: inline-block; }
        .menu-name { flex-grow: 1; margin-left: 15px; font-size: 18px; }
        .plus-btn { font-size: 24px; color: #666; cursor: pointer; }
        .next-btn-circle { position: absolute; bottom: 20px; right: 20px; width: 50px; height: 50px; border: 2px solid #333; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 24px; cursor: pointer; }
        
        /* 畫面4: 取餐時間 */
        .time-select { width: 80%; padding: 10px; font-size: 20px; border: 2px solid #333; margin: 20px auto; display: block; text-align: center; }
        .pay-options { margin-top: 40px; font-size: 18px; }
        .pay-options input { margin-right: 10px; }
        
        /* 畫面5: 已送出 */
        .success-title { font-size: 28px; margin-bottom: 30px; }
        .details { font-size: 18px; line-height: 2; margin-bottom: 40px; }
        .counter-img { width: 200px; height: 150px; border: 2px solid #ccc; margin: 0 auto; display: flex; justify-content: center; align-items: center; color: #999; }
        .home-btn { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); font-size: 24px; cursor: pointer; border: 1px solid #333; padding: 10px 30px; border-radius: 8px; }
    </style>
</head>
<body>
    <div class="app">
        <!-- 畫面1: 找餐 -->
        <div id="screen1" class="screen active">
            <div class="title">找餐</div>
            <div class="category-container">
                <div class="category-box">飯</div>
                <div class="category-box">麵</div>
                <div class="category-box">飲</div>
            </div>
            <div class="restaurant-card" onclick="goTo('screen2')">
                <span>店1</span>
                <span>20 min</span>
            </div>
            <div class="restaurant-card" onclick="goTo('screen2')">
                <span>店2</span>
                <span>30 min</span>
            </div>
        </div>

        <!-- 畫面2: 目前 12:00 -->
        <div id="screen2" class="screen">
            <div class="back-btn" onclick="goTo('screen1')">&lt; 目前 12:00</div>
            <div>🚶🚶🚶...</div>
            <div class="center-content">
                <div style="font-size: 60px;">🍳</div>
                <div class="big-time">20分鐘...</div>
            </div>
            <div class="bottom-btn" onclick="goTo('screen3')">訂餐</div>
        </div>

        <!-- 畫面3: 預訂 -->
        <div id="screen3" class="screen">
            <div style="text-align: center; font-size: 40px; margin-bottom: 20px;">🍳</div>
            <div style="border: 2px solid #333; display: inline-block; padding: 2px 5px; margin-bottom: 20px;">✔ 預訂</div>
            
            <div class="menu-item">
                <div class="checkbox"></div>
                <div class="menu-name">料理1</div>
                <div class="plus-btn" onclick="goTo('screen4')">+</div>
            </div>
            <div class="menu-item">
                <div class="checkbox"></div>
                <div class="menu-name">料理2</div>
                <div class="plus-btn" onclick="goTo('screen4')">+</div>
            </div>
            <div class="menu-item">
                <div class="checkbox"></div>
                <div class="menu-name">料理3</div>
                <div class="plus-btn" onclick="goTo('screen4')">+</div>
            </div>
            
            <div class="next-btn-circle" onclick="goTo('screen4')">→</div>
        </div>

        <!-- 畫面4: 取餐時間 -->
        <div id="screen4" class="screen">
            <div style="text-align: center; margin: 40px 0;">
                <div style="width: 150px; height: 100px; border: 2px solid #333; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr;">
                    <div style="border-right: 1px solid #333; border-bottom: 1px solid #333;"></div>
                    <div style="border-bottom: 1px solid #333;"></div>
                    <div style="border-right: 1px solid #333;"></div>
                    <div></div>
                </div>
            </div>
            
            <div class="title" style="border: none;">取餐時間？</div>
            <select class="time-select">
                <option>12 : 40 ✔</option>
                <option>12 : 50</option>
                <option>13 : 00</option>
            </select>
            
            <div class="pay-options">
                <span style="font-size: 24px; margin-right: 10px;">$</span>
                <input type="radio" name="pay" checked> 現金 
                <input type="radio" name="pay"> Line pay 
                <input type="radio" name="pay"> 信用卡
            </div>
            
            <div class="next-btn-circle" onclick="goTo('screen5')">→</div>
        </div>

        <!-- 畫面5: 已送出 -->
        <div id="screen5" class="screen">
            <div class="success-title">已送出 ✔</div>
            <div class="details">
                - 取餐 12:40<br>
                - Line pay (已付款)
            </div>
            
            <div class="counter-img">
                櫃檯/店員插圖...
            </div>
            
            <div class="home-btn" onclick="goTo('screen1')">回首頁</div>
        </div>
    </div>

    <script>
        function goTo(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }
    </script>
</body>
</html>
